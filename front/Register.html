<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <title>Registro - InduRiver</title>
</head>
<body>
    <div class="header">
        <div class="icono"><a href="index.html"><img src="img/logo.webp" alt="Logo InduRiver"></a></div>
        <div class="busquera">
            <input type="search" class="search-input" placeholder="Buscar..." aria-label="Buscar">
        </div>
        
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-btn"><i class="fas fa-bars"></i></label>
        
        <div class="header-actions">
            <div class="login"><a href="login.html">login</a></div>
            <div class="register"><a href="Register.html">register</a></div>
            <div class="carrito"><a href="backendFunc.html">carrito</a></div>
        </div>
    </div>

    <form>
        <h1 style="color: #333; text-align: center; margin-bottom: 20px;">Registrarse</h1>
        
        <label for="nombre">Nombre Completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
        
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com" required>
        
        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" name="usuario" placeholder="Elige un usuario" required>
        
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>
        
        <label for="password-confirm">Confirmar Contraseña:</label>
        <input type="password" id="password-confirm" name="password-confirm" placeholder="Confirma tu contraseña" required>
        
        <button type="submit">Registrarse</button>
    </form>

    <footer>
        <p class="footerText">© 2026 InduRiver. All rights reserved.</p>
        <div class="footer-links">
            <a href="https://www.instagram.com/induriver" class="footerlink" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://www.facebook.com/induriver" class="footerlink" title="Facebook">
                <i class="fab fa-facebook"></i>
            </a>
            <a href="https://www.twitter.com/induriver" class="footerlink" title="Twitter">
                <i class="fab fa-twitter"></i>
            </a>
        </div>
    </footer>
</body>
</html>
